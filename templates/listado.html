<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Avistamientos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/stylesListado.css') }}">
  <style>
    tbody tr { cursor: pointer; }
    tbody tr:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="encasillado">
    <header>
      <h2>Avistamientos</h2>
    </header>

    <div>
      <select id="filtro">
        <option value="">Tipos</option>
        <option value="Rapaz">Rapaz</option>
        <option value="Passeriforme">Passeriforme</option>
      </select>
      
      <select id="orden">
        <option value="time">Fecha</option>
        <option value="place">Lugar</option>
      </select>
    </div>

    <table>
      <thead>
        <tr><th>Ave</th><th>Tipo</th><th>Fecha</th><th>Lugar</th></tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>

    <div class="paginacion">
      <button id="prev" type="button">Anterior</button>
      <span id="p-info">1</span>
      <button id="next" type="button">Siguiente</button>
    </div>
    
    <a href="/">
        <button id="start-btn" type="button">Volver</button>
    </a>
  </div>
  
  <script>
    const datos = {{ avistamientos_json | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/listado.js') }}"></script>
</body>
</html>
